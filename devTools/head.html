<script>
/* Storage fallback: localStorage/sessionStorage/indexedDB may be missing or throw
   (private windows, blocked storage). Keep an in-memory stub so boot cannot loop.
   devTools/prepend-storage-fallback.py copies it to the top of <head> after each build:
   this script must run before SugarCube libraries: SugarCube disables its IDB
   adapter only when window.indexedDB == null, and otherwise calls indexedDB.open(). */
(function(){
  function makeStub(){
    var mem = {};
    return {
      getItem: function(k){ k = String(k); return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
      setItem: function(k, v){ try { mem[String(k)] = String(v); } catch(e){} },
      removeItem: function(k){ delete mem[String(k)]; },
      clear: function(){ mem = {}; },
      key: function(i){ return Object.keys(mem)[i] || null; },
      get length(){ return Object.keys(mem).length; }
    };
  }
  var memLS = makeStub();
  var memSS = makeStub();
  function works(s){
    try {
      if (!s || typeof s.getItem !== "function" || typeof s.setItem !== "function") return false;
      var t = "__dol_store_test__";
      s.setItem(t, "1");
      var ok = s.getItem(t) === "1";
      s.removeItem(t);
      return ok;
    } catch (e) { return false; }
  }
  function defineOn(obj, name, stub){
    try {
      Object.defineProperty(obj, name, { value: stub, configurable: true, writable: true, enumerable: true });
      return works(obj[name]);
    } catch (e) { return false; }
  }
  function ensure(name, stub){
    try { if (works(window[name])) return true; } catch (e) {}
    try { delete window[name]; } catch (e) {}
    if (defineOn(window, name, stub)) return true;
    try {
      if (typeof Window !== "undefined" && Window.prototype && defineOn(Window.prototype, name, stub)) return true;
    } catch (e) {}
    try { window[name] = stub; } catch (e) {}
    try { return works(window[name]); } catch (e) { return false; }
  }
  var nativeLS = false;
  var nativeSS = false;
  try { nativeLS = works(window.localStorage); } catch (e) {}
  try { nativeSS = works(window.sessionStorage); } catch (e) {}
  ensure("localStorage", memLS);
  ensure("sessionStorage", memSS);
  try {
    if (typeof Storage !== "undefined" && Storage.prototype) {
      ["getItem","setItem","removeItem","clear","key"].forEach(function(method){
        try {
          var orig = Storage.prototype[method];
          if (typeof orig !== "function") return;
          Storage.prototype[method] = function(){
            try { return orig.apply(this, arguments); }
            catch (e) {
              var stub = memLS;
              try { if (this === window.sessionStorage) stub = memSS; } catch (e2) {}
              return stub[method].apply(stub, arguments);
            }
          };
        } catch (e) {}
      });
    }
  } catch (e) {}
  function disableIndexedDB(){
    function setNull(obj){
      try { delete obj.indexedDB; } catch (e) {}
      try {
        Object.defineProperty(obj, "indexedDB", { value: null, configurable: true, writable: true, enumerable: true });
        return obj.indexedDB == null;
      } catch (e) {
        try { obj.indexedDB = null; return obj.indexedDB == null; } catch (e2) { return false; }
      }
    }
    setNull(window);
    try { if (typeof Window !== "undefined" && Window.prototype) setNull(Window.prototype); } catch (e) {}
  }
  function idbUnusable(){
    try {
      if (window.indexedDB == null) return true;
      if (typeof window.indexedDB.open !== "function") return true;
    } catch (e) { return true; }
    try { window.indexedDB.open("__dol_idb_probe__"); }
    catch (e) { return true; }
    return false;
  }
  if (!nativeLS || !nativeSS || idbUnusable()) {
    disableIndexedDB();
  }
  try {
    if (navigator.storage && typeof navigator.storage.persist === "function") {
      var persistOrig = navigator.storage.persist.bind(navigator.storage);
      navigator.storage.persist = function(){
        try { return persistOrig(); } catch (e) { return Promise.resolve(false); }
      };
    }
  } catch (e) {}
})();
</script>

<!-- SugarCube rejects localStorage when sessionStorage is unavailable. Supply a session-only fallback before SugarCube selects its save adapter. -->
<script>
(() => {
	function storageWorks(name) {
		const testKey = `_dol_storage_test_${Date.now()}`;
		try {
			const store = window[name];
			store.setItem(testKey, testKey);
			const works = store.getItem(testKey) === testKey;
			store.removeItem(testKey);
			return works;
		} catch (ex) {
			return false;
		}
	}

	if (storageWorks("localStorage") && !storageWorks("sessionStorage")) {
		const data = new Map();
		try {
			Object.defineProperty(window, "sessionStorage", {
				configurable: true,
				value: {
					get length() {
						return data.size;
					},
					key(index) {
						return Array.from(data.keys())[index] ?? null;
					},
					getItem(key) {
						return data.has(key) ? data.get(key) : null;
					},
					setItem(key, value) {
						const storedValue = String(value);
						data.set(key, storedValue);
						this[key] = storedValue;
					},
					removeItem(key) {
						data.delete(key);
						delete this[key];
					},
					clear() {
						data.forEach((value, key) => delete this[key]);
						data.clear();
					},
				},
			});
		} catch (ex) {
			/* Keep the native backend so SugarCube can show its normal storage warning. */
		}
	}
})();
</script>
