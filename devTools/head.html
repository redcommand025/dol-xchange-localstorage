<script>
/* Storage fallback for devices with no storage (localStorage/sessionStorage null or blocked).
   Saves stay in memory only — use Export / Copy Text Area to keep them. */
(function(){
  function makeStub(){
    var mem = {};
    return {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
      setItem: function(k, v){ try { mem[String(k)] = String(v); } catch(e){} },
      removeItem: function(k){ delete mem[k]; },
      clear: function(){ mem = {}; },
      key: function(i){ return Object.keys(mem)[i] || null; },
      get length(){ return Object.keys(mem).length; }
    };
  }
  function ensure(name){
    var ok = false;
    try {
      var s = window[name];
      if (s && typeof s.getItem === "function") {
        var t = "__dol_" + name + "_test";
        s.setItem(t, "1");
        s.removeItem(t);
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) {
      var stub = makeStub();
      try { Object.defineProperty(window, name, { value: stub, configurable: true, writable: true }); }
      catch (e1) {
        try { window[name] = stub; } catch (e2) {}
      }
    }
  }
  ensure("localStorage");
  ensure("sessionStorage");
})();
</script>

<!-- SugarCube rejects localStorage when sessionStorage is unavailable. Supply a session-only fallback before SugarCube selects its save adapter. -->
<script>
(() => {
	function storageWorks(name) {
		const testKey = `_dol_storage_test_${Date.now()}`;
		try {
			const store = window[name];
			store.setItem(testKey, testKey);
			const works = store.getItem(testKey) === testKey;
			store.removeItem(testKey);
			return works;
		} catch (ex) {
			return false;
		}
	}

	if (storageWorks("localStorage") && !storageWorks("sessionStorage")) {
		const data = new Map();
		try {
			Object.defineProperty(window, "sessionStorage", {
				configurable: true,
				value: {
					get length() {
						return data.size;
					},
					key(index) {
						return Array.from(data.keys())[index] ?? null;
					},
					getItem(key) {
						return data.has(key) ? data.get(key) : null;
					},
					setItem(key, value) {
						const storedValue = String(value);
						data.set(key, storedValue);
						this[key] = storedValue;
					},
					removeItem(key) {
						data.delete(key);
						delete this[key];
					},
					clear() {
						data.forEach((value, key) => delete this[key]);
						data.clear();
					},
				},
			});
		} catch (ex) {
			/* Keep the native backend so SugarCube can show its normal storage warning. */
		}
	}
})();
</script>
